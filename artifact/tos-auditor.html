const TYPES_MD = "# Conflict types\n\nA conflict is always a pair of norms inside the same document that cannot both be applied to the same situation. Every conflict needs two quotes from the main text of clauses.\n\n## claim_vs_mechanic\n### Definition\nA general claim or promise (for example \"non-custodial\", \"you keep exclusive control\", \"withdraw at any time\") is contradicted by a concrete mechanism described elsewhere in the document (for example pooled addresses, keys held by the company, company-initiated transfers, mandatory delays).\n### Example\nClause A: \"The Service is fully non-custodial and users retain exclusive control of their assets.\"\nClause B: \"Deposited assets are transferred to wallets whose signing keys are held by the Company.\"\n### Не считать конфликтом\n- Marketing or TL;DR summaries that simplify the main text (quote the main clause, never the TL;DR).\n- A claim that is limited to a specific product or module when the mechanic belongs to a different product.\n- Mechanics that apply only to an optional, explicitly separate feature that the claim expressly excludes.\n\n## claim_vs_exception\n### Definition\nA rule stated in absolute terms is cut down by an exception or carve-out in another clause so that the absolute wording becomes false or meaningless.\n### Example\nClause A: \"We never restrict withdrawals.\"\nClause B: \"We may suspend withdrawals at our discretion.\"\n### Не считать конфликтом\n- Exceptions that are announced in the rule itself (\"except as provided in Section 9\").\n- Standard legal carve-outs such as \"to the extent permitted by law\" or \"except where liability cannot lawfully be excluded\".\n- A rule and an exception that apply to clearly different situations.\n\n## circular\n### Definition\nTwo or more clauses refer to each other (or to a definition that refers back) so that the obligation or the rights can never be determined.\n### Example\nClause A: \"Fees are as set out in the Fee Policy.\"\nClause B (Fee Policy): \"Fees are as set out in the Terms of Service.\"\n### Не считать конфликтом\n- Ordinary cross-references that end in a concrete rule.\n- Incorporation by reference of an external document that is simply not provided (that is insufficient_data, not circular).\n\n## definition_drift\n### Definition\nThe same defined term is used with different meanings in different clauses, or a term is defined one way and used in a way that does not fit its definition, and the difference changes the legal outcome.\n### Example\nDefinition: \"'User' means a person over 18.\" Later: \"Users under 16 may use the Service with parental consent.\"\n### Не считать конфликтом\n- Stylistic variation between synonyms with no legal effect.\n- Terms deliberately scoped (\"for the purposes of this Section, ...\").\n";

/* ---------- text normalisation + parsing (port of the terminal pipeline) ---------- */
function norm(s){let t="",m=[],i=0;for(const ch of s){for(const c of ch.normalize("NFKC").toLowerCase()){if(/[\p{L}\p{N}]/u.test(c)){t+=c;m.push(i)}}i+=ch.length}return{t,m}}

const CLAUSE=/^\d+(\.\d+)+\.?\s+\S/, NUMBERED=/^\d{1,2}(\.\d{1,2})*\.?\s+\p{Lu}/u, PART=/^(ЧАСТЬ|PART|ARTICLE|SECTION|APPENDIX|ПРИЛОЖЕНИЕ)\s+[IVX\d]+/i;
const isHead=t=>!!t&&((PART.test(t)&&t.length<120)||(NUMBERED.test(t)&&t.length<=80&&!/[.;,:!?]$/.test(t)));
const slug=s=>s.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-+|-+$/g,"").slice(0,40)||"section";
function parse(text){
  const lines=text.replace(/[­​‌‍⁠﻿]/g,"").replace(/ /g," ").split("\n");
  const blocks=[];let cur=null,prev=0;const flush=()=>{if(cur)blocks.push(cur);cur=null};
  for(const raw of lines){
    const t=raw.replace(/^#{1,6}\s+/,"").replace(/[ \t]+/g," ").trim();
    if(!t){flush();prev=0;continue}
    if(/^(page\s*)?\d{1,3}(\s*(of|\/)\s*\d{1,3})?$/i.test(t))continue;
    if(/^#{1,6}\s+\S/.test(raw.trim())||isHead(t)){flush();blocks.push({h:1,t});prev=0;continue}
    const startsNew=CLAUSE.test(t)||/^([-•*]|\(\w\))\s/.test(t)||/^TL;DR/i.test(t)||(cur&&prev>0&&prev<70&&/[.:;!?»”"]$/.test(cur.t));
    if(cur&&!startsNew)cur.t+=" "+t;else{flush();cur={t}}
    prev=t.length;
  }
  flush();
  const raws=[{title:"Preamble",paras:[]}];
  for(const b of blocks){
    if(b.h){const sub=/^\d{1,2}\.\d/.test(b.t)&&!/^appendix/i.test(b.t);
      if(sub&&raws.length>1){raws[raws.length-1].paras.push(b.t);continue}
      raws.push({title:b.t,paras:[]})}
    else raws[raws.length-1].paras.push(b.t);
  }
  const out=[];let pos=0;
  for(const r of raws){if(!r.paras.length)continue;pos++;
    const base="s"+String(pos).padStart(2,"0")+"-"+slug(r.title);
    const chunks=[];let c="";
    for(const p of r.paras){if(c&&c.length+p.length+2>8000){chunks.push(c);c=""}c=c?c+"\n\n"+p:p}
    if(c)chunks.push(c);
    chunks.forEach((x,i)=>out.push({id:chunks.length>1?base+".p"+(i+1):base,title:chunks.length>1?`${r.title} (часть ${i+1}/${chunks.length})`:r.title,text:x}));
  }
  return out;
}

    for(;;){const at=n.t.indexOf(q,from);if(at<0)break;from=at+1;
      const a=n.m[at],b=n.m[at+q.length-1]+1;
      const ps=s.text.lastIndexOf("\n\n",a)+2>1?s.text.lastIndexOf("\n\n",a)+2:0;
      const para=s.text.slice(ps);
      if(/^\s*tl;?\s*dr\b/i.test(para)){tl=true;continue}
      const cl=para.match(/^(\d+(?:\.\d+)+)/);
      return{ok:true,text:s.text.slice(a,b).replace(/\s+/g," "),loc:s.title+(cl?`, п. ${cl[1]}`:"")}}}
  return{ok:false,reason:tl?"цитата из TL;DR":"цитата не найдена в документе"};
}

/* ---------- tools given to Claude ---------- */
function makeTools(secs,log){
  return [
    {name:"list_sections",description:"List all sections: id, title, length in characters.",execute:()=>{log("tool","list_sections");return secs.map(s=>({id:s.id,title:s.title,chars:s.text.length}))}},
    {name:"read_section",description:"Read the full text of one section by id.",inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
      execute:({id})=>{const s=secs.find(x=>x.id===String(id));log("tool","read_section "+id);if(!s)throw new Error("Unknown section id; call list_sections");return `# ${s.title}\n\n${s.text}`}},
    {name:"search_document",description:"Case-insensitive search for a phrase or words; returns up to 8 snippets with section ids.",inputSchema:{type:"object",properties:{q:{type:"string"}},required:["q"]},
      execute:({q})=>{q=String(q);log("tool","search_document «"+q+"»");const needle=nt(q);const words=q.toLowerCase().split(/\s+/).filter(w=>w.length>2).map(nt).filter(Boolean);
        const paras=secs.flatMap(s=>s.text.split("\n\n").map(p=>({s,p,n:nt(p)})));
        let m=needle?paras.filter(x=>x.n.includes(needle)):[];if(!m.length&&words.length)m=paras.filter(x=>words.every(w=>x.n.includes(w)));
        return m.length?m.slice(0,8).map(x=>({section_id:x.s.id,snippet:x.p.slice(0,400)})):"No matches."}},
    {name:"verify_quote",description:"Check that a quote occurs verbatim in the document. Returns ok, location and exact text.",inputSchema:{type:"object",properties:{text:{type:"string"}},required:["text"]},
      execute:({text})=>{const r=verifyQuote(secs,String(text));log("tool","verify_quote → "+(r.ok?"ок":"нет"));return r}},
  ];
}

/* ---------- prompts (built from the embedded copies of config/) ---------- */
const RULES=`Hard rules:
1. Do not invent violations. A conflict needs TWO quotes from the document that cannot both be applied to the same situation. If you cannot quote both sides, there is no finding. An empty list is a normal, good outcome.
2. Quote the main text of the clause, never a "TL;DR" summary. Copy quotes verbatim from read_section output (one or two sentences) and run verify_quote on EVERY quote. Drop any finding whose quotes do not verify.
3. If deciding requires a document that is not provided (for example a Privacy Policy), return status "insufficient_data" with the quote that references it.
4. Do not report differences that disappear on a reasonable reading, standard legal carve-outs ("to the extent permitted by law"), claims limited to a different product, or anything under "Не считать конфликтом" for the type.
5. One finding = ONE pair of clauses: exactly two quotes (the strongest claim and the strongest counter-clause). Do not report the same tension several times. But be exhaustive over DISTINCT points: a promise contradicted by two different mechanisms (for example "where assets are held / who holds keys" and "who may initiate transfers") gives two findings.
6. Each finding uses exactly one conflict type: ${TYPES.join(", ")}. Quote roles: ${ROLES.join(", ")}.`;
const TOOLS_TXT=`Tools: list_sections(), read_section(id), search_document(q), verify_quote(text). The document is only accessible through them.`;
const FORMAT=`Reply with ONLY one JSON object: {"findings":[{"type":"<type>","status":"conflict"|"insufficient_data","quotes":[{"text":"<verbatim>","role":"claim|mechanic|exception|definition|reference"}],"explanation":"...","suggestedFix":"..."}]}. Write explanation and suggestedFix in Russian; quotes stay in the document's language. No other text.`;
const topicPrompt=t=>`You are a legal-contradiction analyst for Web3 Terms of Service. You work ONLY on the topic "${t.topic}".\nScope: ${t.description}\nWatch for: ${t.watch_for}\n\n${TOOLS_TXT}\nMethod: call list_sections, use search_document and read_section to read every clause relevant to your topic (whole sections), then compare clauses against each other.\n\n${RULES}\n\nCONFLICT TYPES:\n${TYPES_MD}\n\n${FORMAT}`;
const verifierPrompt=(c)=>`You are the verifier of a candidate contradiction in a Web3 Terms of Service. Try to RECONCILE the two norms: find a reasonable, text-based reading under which both hold (different scope or product, one clause qualifying the other, standard carve-out, a defined term). Use the tools to read surrounding clauses and definitions first.\n- reconcilable=true only if you can state a concrete reading under which both quotes hold; put it in reconcileNote.\n- reconcilable=false if no honest reading makes both hold; in reconcileNote list the reconciliation attempts and why each fails.\nDo not assume facts that are not in the document.\n\n${TOOLS_TXT}\n\nTopic: ${c.topic}; type: ${c.type}\nAnalyst explanation: ${c.explanation}\nQuotes:\n${c.quotes.map((q,i)=>`${i+1}. [${q.role}] (${q.loc}) "${q.text}"`).join("\n")}\n\nReply with ONLY JSON: {"reconcilable":true|false,"reconcileNote":"<in Russian>"}`;

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const docEl=$("doc"),runEl=$("run"),stopEl=$("stop"),logEl=$("log"),outEl=$("out");
let sample=null,ctl=null,result=null;
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function updMeta(){const n=docEl.value.trim().length;let secs=n?parse(docEl.value).length:0;
  $("docmeta").textContent=n?`${n.toLocaleString("ru")} символов · разделов найдено: ${secs}`:"";runEl.disabled=!sample||n<200}
docEl.addEventListener("input",updMeta);
$("ex3").onclick=()=>{docEl.value=EXAMPLES.bad3;updMeta()};
$("ex2").onclick=()=>{docEl.value=EXAMPLES.bad2;updMeta()};
stopEl.onclick=()=>ctl&&ctl.abort();

/* ---------- file loading: PDF (pdf.js), DOCX (mammoth), TXT/MD ---------- */
async function pdfText(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;let out="";
  for(let p=1;p<=pdf.numPages;p++){const c=await (await pdf.getPage(p)).getTextContent();
    for(const it of c.items){out+=it.str;out+=it.hasEOL?"\n":""}out+="\n"}
  return out;
}
async function loadFile(f){
  const info=$("fileinfo");info.textContent="Читаю "+f.name+"…";
  try{
    const name=f.name.toLowerCase();let text;
    if(name.endsWith(".pdf")){if(!window.pdfjsLib)throw new Error("библиотека PDF не загрузилась");text=await pdfText(await f.arrayBuffer())}
    else if(name.endsWith(".docx")){if(!window.mammoth)throw new Error("библиотека DOCX не загрузилась");text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
    else text=await f.text();
    text=text.replace(/\r\n?/g,"\n").trim();
    if(text.length<200)throw new Error("в файле почти нет текста (возможно, это скан)");
    docEl.value=text;updMeta();info.textContent="Загружено: "+f.name;
  }catch(e){info.textContent="Не удалось прочитать "+f.name+": "+(e&&e.message||"ошибка")}
}
$("file").addEventListener("change",e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value=""});
const drop=$("drop");
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor="var(--accent)"}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor=""}));
drop.addEventListener("drop",e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadFile(f)});
(async()=>{try{sample=await claude.use("sample")}catch(e){sample=null}
  if(!sample){runEl.disabled=true;$("docmeta").textContent="Запуск анализа недоступен в этом окне просмотра."}else updMeta()})();

let logLines=[];
function addLog(kind,msg){const d=document.createElement("div");d.innerHTML=(kind==="tool"?"  · ":"<b>▸ </b>")+esc(msg);
  if(kind==="tool"){const prev=logEl.querySelector("[data-live]");if(prev)prev.remove();d.dataset.live=1}
  logEl.append(d);if(logEl.children.length>60)logEl.firstChild.remove()}
const errCopy={not_granted:"Вы не разрешили использовать Claude для этого артефакта.",rate_limited:"Достигнут лимит запросов, попробуйте позже.",invalid_json:"Модель вернула ответ не в формате JSON. Запустите ещё раз.",upstream_error:"Временная ошибка сервиса. Запустите ещё раз.",tools_unavailable:"В этом окне просмотра инструменты недоступны."};

async function ask(prompt,tools,tier,label){
  try{return await sample.json(prompt,{tools,modelTier:tier,signal:ctl.signal})}
  catch(e){if(e&&e.code==="cancelled")throw e;throw Object.assign(new Error(label+": "+(errCopy[e&&e.code]||(e&&e.message)||"ошибка")),{code:e&&e.code})}
}

runEl.onclick=async()=>{
  const text=docEl.value;const secs=parse(text);
  if(secs.length<2){alert&&0;$("docmeta").textContent="Не удалось выделить разделы: нужны нумерованные заголовки.";return}
  ctl=new AbortController();runEl.disabled=true;stopEl.hidden=false;outEl.hidden=true;outEl.innerHTML="";logEl.innerHTML="";$("progress").hidden=false;
  const tier=$("tier").value,dropped=[],t0=Date.now();
  const log=(k,m)=>addLog(k,m);
  try{
    log("step",`Разделов: ${secs.length}. Запускаю ${TOPICS.length} агента(ов) по темам`);
    const per=await Promise.all(TOPICS.map(async t=>{
      const r=await ask(topicPrompt(t),makeTools(secs,log),tier,"тема "+t.topic);
      const f=Array.isArray(r&&r.findings)?r.findings:[];
      log("step",`Тема «${t.topic}»: кандидатов ${f.length}`);return f.map(x=>({...x,topic:t.topic}))}));
    // code-level verification + dedupe
    const seen=new Set(),cands=[];
    for(const f of per.flat()){
      const quotes=[];let bad=null;
      for(const q of (f.quotes||[])){const v=verifyQuote(secs,String(q.text||""));if(!v.ok){bad=v.reason+`: «${String(q.text||"").slice(0,80)}»`;break}
        quotes.push({text:v.text,loc:v.loc,role:ROLES.includes(q.role)?q.role:"reference"})}
      const need=f.status==="insufficient_data"?1:2;
      if(!bad&&new Set(quotes.map(q=>nt(q.text))).size<need)bad=`нужно ${need} разных проверенных цитаты`;
      if(!bad&&!TYPES.includes(f.type))bad="неизвестный тип "+f.type;
      if(bad){dropped.push({topic:f.topic,reason:bad});continue}
      const key=quotes.map(q=>nt(q.text).slice(0,60)).sort().join("|");
      if(seen.has(key)){dropped.push({topic:f.topic,reason:"дубликат другой находки"});continue}
      seen.add(key);cands.push({...f,quotes,key})}
    log("step",`После проверки цитат: ${cands.length} (отброшено ${dropped.length})`);
    const conflicts=await Promise.all(cands.map(async(c,i)=>{
      const id="C-"+[...c.key].reduce((h,ch)=>(h*31+ch.charCodeAt(0))>>>0,7).toString(16).padStart(8,"0").slice(0,8);
      if(c.status==="insufficient_data")return{conflictId:id,topic:c.topic,type:c.type,status:"insufficient_data",quotes:c.quotes,explanation:c.explanation,reconcileNote:"",suggestedFix:c.suggestedFix||""};
      const v=await ask(verifierPrompt(c),makeTools(secs,log),tier,"верификатор");
      const rec=!!(v&&v.reconcilable);log("step",`Верификатор ${i+1}/${cands.length}: ${rec?"needs_review":"conflict"}`);
      return{conflictId:id,topic:c.topic,type:c.type,status:rec?"needs_review":"conflict",quotes:c.quotes,explanation:c.explanation,reconcileNote:String(v&&v.reconcileNote||""),suggestedFix:c.suggestedFix||""}}));
    result={conflicts:conflicts.map(c=>({...c,quotes:c.quotes.map(q=>({text:q.text,location:q.loc,role:q.role}))})),dropped};
    render(conflicts,dropped,((Date.now()-t0)/1000).toFixed(0));
    log("step","Готово");
  }catch(e){
    if(e&&e.code==="cancelled")log("step","Остановлено");
    else{const d=document.createElement("div");d.className="err";d.textContent=(e&&e.message)||"Ошибка";logEl.append(d)}
  }finally{runEl.disabled=false;stopEl.hidden=true;updMeta()}
};

const STATUS_RU={conflict:"конфликт",needs_review:"нужна проверка",insufficient_data:"мало данных"};
const ROLE_RU={claim:"заявление",mechanic:"механизм",exception:"исключение",definition:"определение",reference:"отсылка"};
function render(cs,dropped,sec){
  const n=s=>cs.filter(c=>c.status===s).length;
  let h=`<div class="panel"><div class="summary"><div><strong>${n("conflict")}</strong> <span class="note">конфликт</span></div><div><strong>${n("needs_review")}</strong> <span class="note">нужна проверка</span></div><div><strong>${n("insufficient_data")}</strong> <span class="note">мало данных</span></div><span class="meta" style="margin-left:auto">${sec} с</span></div>
  <div class="row"><button id="copy">Скопировать JSON</button><span class="meta" id="copied"></span></div></div>`;
  if(!cs.length)h+=`<div class="panel"><p>Противоречий с двумя проверенными цитатами не найдено.</p></div>`;
  const order={conflict:0,needs_review:1,insufficient_data:2};
  for(const c of [...cs].sort((a,b)=>order[a.status]-order[b.status])){
    h+=`<article class="card ${c.status}"><div class="row"><span class="badge ${c.status}">${STATUS_RU[c.status]}</span><span class="tag">${esc(c.topic)} · ${esc(c.type)} · ${c.conflictId}</span></div>
    <div class="vs">${c.quotes.map(q=>`<blockquote><span class="lbl">${ROLE_RU[q.role]||q.role}</span><q>${esc(q.text)}</q><span class="loc">${esc(q.loc)}</span></blockquote>`).join("")}</div>
    <p>${esc(c.explanation)}</p>
    ${c.reconcileNote?`<details><summary>Попытка примирить нормы</summary><p style="white-space:pre-line;margin-top:8px">${esc(c.reconcileNote)}</p></details>`:""}
    ${c.suggestedFix?`<p><span class="lbl">Как исправить</span><br>${esc(c.suggestedFix)}</p>`:""}</article>`}
  if(dropped.length)h+=`<details class="panel"><summary>Отброшенные кандидаты: ${dropped.length}</summary><div class="dropped">${dropped.map(d=>`<div>[${esc(d.topic)}] ${esc(d.reason)}</div>`).join("")}</div></details>`;
  outEl.innerHTML=h;outEl.hidden=false;
  $("copy").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify({conflicts:result.conflicts},null,2));$("copied").textContent="Скопировано"}catch{$("copied").textContent="Не удалось скопировать"}};
}
</script>
